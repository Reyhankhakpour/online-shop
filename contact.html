<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Lune</title><meta name="description" content="Send a message to the Lune team."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body><a class="skip" href="#main">Skip to content</a><header id="site-header"></header><main id="main">

<section class="wrap narrow"><h1>Contact</h1><p>Questions about sizing or an order? Write to us below. Sending opens your email app with the message ready to go.</p>
<form id="contact" novalidate>
 <label for="name">Your name</label><input id="name" name="name" autocomplete="name"><span class="err" id="name-err"></span>
 <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="err" id="email-err"></span>
 <label for="subject">Subject</label><input id="subject" name="subject"><span class="err" id="subject-err"></span>
 <label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="err" id="message-err"></span>
 <button class="btn" type="submit">Send message</button>
 <p id="sent" role="status" hidden>Your email app should have opened. If not, write to hello@example.com.</p>
</form></section>
</main><footer id="site-footer"></footer></body></html>
